# metadata
run_name: 'oschersleben_wide'
# characteristic number for map
perf_num: 6

# map paths -- track boundaries redrawn wider (1.6m each side / 3.2m total,
# vs. the original 1.1m each side / 2.2m total) using the centerline+width data,
# since the original map's boundary lines are too thin (~2px) to grow via
# morphological dilation without erasing them
map_path: './oschersleben_map_wide'
map_ext: '.png'

# starting pose for map (first raceline waypoint)
sx: 0.0776411
sy: 0.0197835
stheta: 2.7859471

# raceline path and indices
wpt_path: './oschersleben_raceline.csv'
wpt_delim: ';'
wpt_rowskip: 3
wpt_xind: 1
wpt_yind: 2
wpt_thind: 3
wpt_vind: 5

# centerline + per-point track width, for rendering track boundaries
# columns: x_m, y_m, w_tr_right_m, w_tr_left_m
centerline_path: './oschersleben_centerline_wide.csv'
centerline_delim: ','
centerline_rowskip: 1

# varied params bound
# physical params
mass_min: 3.0
mass_max: 4.0
lf_min: 0.147
lf_max: 0.170
# controller params
tlad_min: 0.2
tlad_max: 5.
vgain_min: 0.5
vgain_max: 1.5

# computation budget (can think of it as gen_num times pop_size)
popsize: 100
budget: 1000

# optimization method
optim_method: 'CMA'

# seed
seed: 12345
