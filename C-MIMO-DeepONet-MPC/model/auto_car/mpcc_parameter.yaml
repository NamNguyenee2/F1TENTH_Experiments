# ── Autonomous Car parameters ─────────────────────────────────────────────────────────────

DT: 0.05
ZETA_P: 1.0

# State bounds
V_MIN: 1.0
V_MAX: 20.0

# Input bounds
OMEGA_MIN: -3.5
OMEGA_MAX:  3.5
A_MIN: -20.0
A_MAX:  20.0


# ── MPC horizon ─────────────────────────────────────────────────────────────
H: 20           # prediction horizon
N_LAPS: 5       # default simulation laps

# ── Track ───────────────────────────────────────────────────────────────────
TRACK_CSV: "data/map/Oschersleben_centerline.csv"
DELTA_MAX: 1.1    # max distance from centreline [m]
TRACK_WIDTH_RIGHT: 1.1   # [m]
TRACK_WIDTH_LEFT: 1.1   # [m]
n_grid: 20

# ── Default MPC cost weights; theta is scalar q_v ───────────────────────────
Q_C: 1.0      # contour error weight
Q_L: 1000.0   # lag error weight
Q_V: 1.0    # progress reward weight
Q_OMEGA: 0.1      # steering rate penalty
Q_A: 0.1      # acceleration penalty

# ── Data-generation randomisation ───────────────────────────────────────────
N_DATA: 50000
Q_V_MEAN: 100.0
Q_V_STD: 10.0

# ── Learning-to-optimize model/training ─────────────────────────────────────
HIDDEN_DIM: 96
HIDDEN_LAYERS: 3
TRAIN_BATCH_SIZE: 64
TRAINING_ITERATIONS: 30000
TRAINING_LR: 5.0e-3
TRAINING_LR_DECAY_STEPS: 1000
TRAINING_LR_DECAY_RATE: 0.95
MODEL_DIR: "model"
DATA_DIR:  "data/training"

# Feature scales for M_eta([X, Y, phi, v], theta, zeta_p).
X_SCALE: 50.0
Y_SCALE: 30.0
PHI_SCALE: 6.283185307179586
